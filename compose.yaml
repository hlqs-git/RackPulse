services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rackpulse
      POSTGRES_USER: rackpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U rackpulse -d rackpulse']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      RACK_CONFIG: /app/config/racks.yaml
    volumes:
      - ./config/racks.yaml:/app/config/racks.yaml:ro
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
