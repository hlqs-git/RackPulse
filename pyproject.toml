[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rackpulse"
version = "0.3.3"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "SQLAlchemy>=2,<3", "psycopg[binary]>=3,<4", "alembic>=1.14,<2", "APScheduler>=3.11,<4", "PyYAML>=6,<7", "uvicorn>=0.34,<1", "tzdata"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
rackpulse = "rackpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
