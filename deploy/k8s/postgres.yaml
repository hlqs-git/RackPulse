apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app: rackpulse-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: rackpulse-postgres
  template:
    metadata:
      labels:
        app: rackpulse-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: POSTGRES_DB
              value: rackpulse
            - name: POSTGRES_USER
              value: rackpulse
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rackpulse-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          startupProbe:
            exec:
              command: [pg_isready, -U, rackpulse, -d, rackpulse]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [pg_isready, -U, rackpulse, -d, rackpulse]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [pg_isready, -U, rackpulse, -d, rackpulse]
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
